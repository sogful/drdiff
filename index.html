<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>version diff</title>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" href="/favicon.png">

</head>
<body>

  <header class="topbar">
    <div class="versionrail"></div>
  </header>

  <div class="chapterbar">
    <div class="chaptertabs"></div>
    <button class="idfilter" type="button">
      <img class="ifcheck" src="/assets/images/checkoff.png">
      <span class="iftext">
        <span class="iflabel">hide basic id swaps</span>
      </span>
    </button>
  </div>

  <div class="workspace">
    <aside class="sidebar">
      <div class="filelist"></div>
      <div class="changelogswitch">
        <div class="cswlabel">changelogs:</div>
        <div class="cswbtns">
          <button class="cswbtn" data-view="twitter" type="button">
            <img src="/assets/images/twitterbutton.png" alt="twitter"></button>
          <button class="cswbtn" data-view="diff" type="button">
            <img src="/assets/images/splitbutton.png" alt="twitter vs steam"></button>
          <button class="cswbtn" data-view="steam" type="button">
            <img src="/assets/images/steambutton.png" alt="steam"></button>
        </div>
      </div>
    </aside>
    <main class="content"></main>
  </div>

  <script type="module">
    import {pixelize} from "/src/font.js";
    window.pixelize = pixelize;
    window.dispatchEvent(new Event("fontready"));
  </script>
  <script src="/src/gml.js"></script>
  <script src="/src/app.js"></script>

</body>
</html>
