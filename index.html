<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>version diff</title>
  <link rel="stylesheet" href="/src/css/style.css">
  <link rel="icon" href="/favicon.png">

</head>
<body>

  <header class="topbar">
    <div class="versionrail"></div>
  </header>

  <div class="chapterbar"></div>

  <div class="workspace">
    <aside class="sidebar">
      <div class="filelist"></div>
      <div class="changelogswitch">
        <div class="cswlabel">changelogs:</div>
        <div class="cswbtns">
          <button class="cswbtn" data-src="twitter" type="button" title="twitter wording">
            <img src="/assets/images/twitterbutton.png" alt="twitter"></button>
          <button class="cswbtn" data-src="steam" type="button" title="steam wording">
            <img src="/assets/images/steambutton.png" alt="steam"></button>
        </div>
      </div>
    </aside>
    <main class="content"></main>
  </div>

  <script type="module">
    import {pixelize} from "/src/js/font.js";
    window.pixelize = pixelize;
    window.dispatchEvent(new Event("fontready"));
  </script>
  <script src="/src/js/gml.js"></script>
  <script src="/src/js/app.js"></script>

</body>
</html>
